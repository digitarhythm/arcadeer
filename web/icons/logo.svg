<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" shape-rendering="crispEdges">
  <!-- Arcadeer ロゴマーク: ピクセルアート調の鹿（アーケード + ディア） -->
  <rect width="20" height="20" rx="4" fill="#1e1e2e" />
  <g transform="translate(2 3)">
    <g fill="#7aa2f7">
      <!-- 左角 -->
      <rect x="2" y="0" width="1" height="1" />
      <rect x="2" y="1" width="2" height="1" />
      <rect x="4" y="1" width="1" height="3" />
      <!-- 右角 -->
      <rect x="13" y="0" width="1" height="1" />
      <rect x="12" y="1" width="2" height="1" />
      <rect x="11" y="1" width="1" height="3" />
      <!-- 頭部 -->
      <rect x="5" y="4" width="6" height="1" />
      <rect x="4" y="5" width="8" height="1" />
      <rect x="2" y="5" width="2" height="1" />
      <rect x="12" y="5" width="2" height="1" />
      <rect x="3" y="6" width="10" height="4" />
      <rect x="4" y="10" width="8" height="3" />
      <rect x="5" y="13" width="6" height="1" />
    </g>
    <!-- マズル -->
    <rect x="6" y="10" width="4" height="3" fill="#e6e6f0" />
    <!-- 鼻 -->
    <rect x="7" y="11" width="2" height="1" fill="#f7768e" />
    <!-- 目 -->
    <rect x="5" y="7" width="1" height="2" fill="#1e1e2e" />
    <rect x="10" y="7" width="1" height="2" fill="#1e1e2e" />
  </g>
</svg>
