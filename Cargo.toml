[package]
name = "arcadeer"
version = "0.8.3"
edition = "2021"
description = "Arcadeer - Local WebGL Game IDE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Performance",
    "Storage",
    "Crypto",
    "Document",
    "Element",
    "DomTokenList",
    "HtmlCollection",
    "KeyboardEvent",
    "CustomEvent",
    "NodeList",
    "HtmlElement",
    "CssStyleDeclaration",
    "HtmlCanvasElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlDialogElement",
    "Event",
    "EventTarget",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "File",
    "Blob",
    "Url",
    "Response",
    "console",
]

[profile.release]
opt-level = "s"
lto = true
